[package]
name = "auto-rstb"
version = "0.1.0"
edition = "2021"

[package.metadata.skyline]
titleid = "01006F8002326000" # Animal Crossing: New Horizons

[lib]
crate-type = ["cdylib"]

[dependencies]
skyline = "0.6.0"
rstb = { path = "rstb" }
crc32fast = "1.5.0"
talc = { version = "4.4", default-features = false }

[workspace]
members = ["rstb"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
